<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donation Alert</title><link rel="stylesheet" href="/style.css"></head><body><div class="alert"><div id="card" class="alert-card"><div class="pill">💜 NEW DONATION</div><h1 id="amount">฿0</h1><h2 id="donor">ผู้สนับสนุน</h2><p id="message"></p></div></div><script src="/common.js"></script><script>
const u=location.pathname.split("/").pop();let last=0;async function check(){try{let a=await api("/api/donations/"+encodeURIComponent(u));if(a.length&&a[0].id!==last){last=a[0].id;amount.textContent="฿"+Number(a[0].amount).toLocaleString();donor.textContent=a[0].donor||"ผู้สนับสนุน";message.textContent=a[0].message||"ขอบคุณสำหรับการสนับสนุน 💜";card.classList.remove("show");void card.offsetWidth;card.classList.add("show")}}catch{}setTimeout(check,3000)}check();
</script></body></html>
