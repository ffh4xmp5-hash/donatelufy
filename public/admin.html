<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUFY X ADMIN</title><link rel="stylesheet" href="/style.css"></head><body class="dash-body"><header class="nav"><a class="logo" href="/">LUFY X <b>ADMIN</b></a><a class="btn" href="/">เว็บหลัก</a></header><main class="container"><section id="login" class="glass section" style="max-width:520px;margin:60px auto"><div class="section-kicker">ADMIN CONTROL CENTER</div><h2 style="text-align:left">เข้าสู่ระบบ Admin</h2><div class="form"><label>Username</label><input id="au" autocomplete="username"><label>Password</label><input id="ap" type="password" autocomplete="current-password"><button class="btn primary" style="margin-top:14px;width:100%" onclick="login()">เข้าสู่ระบบ</button></div></section><div id="dash" style="display:none"><section class="section"><div class="section-head"><div><div class="section-kicker">MEMBERS</div><h2 style="text-align:left">สมาชิก</h2></div></div><div id="users" class="glass table"></div></section><section class="section"><div class="section-head"><div><div class="section-kicker">UPGRADE REQUESTS</div><h2 style="text-align:left">คำขออัปเกรดแพ็กเกจ</h2></div></div><div id="requests" class="glass table"></div></section><section class="section"><div class="section-head"><div><div class="section-kicker">DONATIONS</div><h2 style="text-align:left">รายการโดเนท</h2></div></div><div id="dons" class="glass table"></div></section><section class="section"><div class="section-head"><div><div class="section-kicker">MEDIA</div><h2 style="text-align:left">วิดีโอ Creator</h2></div></div><div class="glass form"><input id="vc" placeholder="Creator username"><input id="vt" placeholder="ชื่อวิดีโอ" style="margin-top:10px"><input id="vu" placeholder="YouTube / TikTok / Vimeo URL" style="margin-top:10px"><button class="btn primary" style="margin-top:10px" onclick="addVideo()">เพิ่มวิดีโอ</button></div><div id="vids" class="glass" style="margin-top:15px"></div></section></div></main><script src="/common.js"></script><script>
async function login(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:au.value,password:ap.value})});loginBox.style.display='none';dash.style.display='block';await load()}catch(e){alert(e.message)}}
const loginBox=document.getElementById('login');
async function load(){try{const [u,d,v,r]=await Promise.all([api('/api/admin/users'),api('/api/admin/donations'),api('/api/admin/videos'),api('/api/admin/plan-requests')]);users.innerHTML='<table><tr><th>User</th><th>Plan</th><th>ใช้ไป</th><th>เปลี่ยน</th><th>รีเซ็ต</th></tr>'+u.map(x=>'<tr><td>'+esc(x.username)+'</td><td>'+esc(x.plan)+'</td><td>'+x.usage_count+'</td><td><select onchange="setPlan(\''+esc(x.username)+'\',this.value)"><option '+(x.plan==='FREE'?'selected':'')+'>FREE</option><option '+(x.plan==='PRO'?'selected':'')+'>PRO</option><option '+(x.plan==='PROMAX'?'selected':'')+'>PROMAX</option></select></td><td><button class="btn" onclick="resetUse(\''+esc(x.username)+'\')">รีเซ็ต</button></td></tr>').join('')+'</table>';
requests.innerHTML='<table><tr><th>User</th><th>Plan</th><th>Slip</th><th>Status</th><th>Action</th></tr>'+r.map(x=>'<tr><td>'+esc(x.username)+'</td><td>'+esc(x.plan)+'</td><td>'+(x.slip_url?'<a target="_blank" href="'+esc(x.slip_url)+'">ดูสลิป</a>':'-')+'</td><td>'+esc(x.status)+'</td><td>'+(x.status==='PENDING'?'<button class="btn" onclick="reviewPlan('+x.id+',\'APPROVED\')">อนุมัติ</button> <button class="btn" onclick="reviewPlan('+x.id+',\'REJECTED\')">ปฏิเสธ</button>':'-')+'</td></tr>').join('')+'</table>';
dons.innerHTML='<table><tr><th>Creator</th><th>Donor</th><th>Amount</th><th>Payment</th><th>Slip</th><th>Video</th><th>Status</th><th>Message</th></tr>'+d.map(x=>'<tr><td>'+esc(x.creator)+'</td><td>'+esc(x.donor)+'</td><td>฿'+Number(x.amount).toLocaleString()+'</td><td>'+esc(x.payment_method||'')+'</td><td>'+(x.slip_url?'<a href="'+esc(x.slip_url)+'" target="_blank">ดูสลิป</a>':'-')+'</td><td>'+(x.video_url?'<a href="'+esc(x.video_url)+'" target="_blank">ดูคลิป</a>':'-')+'</td><td>'+esc(x.status||'PENDING')+' <button class="btn" onclick="setDonationStatus('+x.id+',\'APPROVED\')">✓</button> <button class="btn" onclick="setDonationStatus('+x.id+',\'REJECTED\')">×</button></td><td>'+esc(x.message)+'</td></tr>').join('')+'</table>';
vids.innerHTML=v.map(x=>'<div style="padding:12px;border-bottom:1px solid #ffffff10">'+esc(x.creator)+' · '+esc(x.title)+' · <a target="_blank" href="'+esc(x.url)+'">เปิด</a></div>').join('')||'ยังไม่มี';}catch(e){alert(e.message)}}
async function reviewPlan(id,status){await api('/api/admin/plan-request/'+id,{method:'POST',body:JSON.stringify({status})});load()}async function setDonationStatus(id,status){await api('/api/admin/donation/'+id+'/status',{method:'POST',body:JSON.stringify({status})});load()}async function setPlan(u,p){await api('/api/admin/plan',{method:'POST',body:JSON.stringify({username:u,plan:p})});load()}async function resetUse(u){await api('/api/admin/reset',{method:'POST',body:JSON.stringify({username:u})});load()}async function addVideo(){try{await api('/api/admin/videos',{method:'POST',body:JSON.stringify({creator:vc.value,title:vt.value,url:vu.value})});vc.value=vt.value=vu.value='';load()}catch(e){alert(e.message)}}
</script></body></html>
