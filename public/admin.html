<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUFY X DONATE — Admin</title><link rel="stylesheet" href="/style.css"></head><body class="dash-body"><main class="dash-main" style="margin-left:0;width:100%;max-width:1500px;margin:auto"><header class="dash-top"><div><div class="eyebrow">LUFY X DONATE</div><h1>Admin Control Center</h1><div class="dash-location">จัดการสมาชิก เครดิต และรายการโดเนท</div></div><a class="btn" href="/">หน้าแรก</a></header><div id="login" class="panel pad narrow" style="margin:80px auto"><h2>เข้าสู่ระบบ Admin</h2><div class="form"><label>Username</label><input id="au"><label>Password</label><input id="ap" type="password"><button class="btn primary" onclick="adminLogin()">เข้าสู่ระบบ</button><p id="am"></p></div></div><div id="app" style="display:none"><div class="kpi-grid"><div class="panel kpi"><small>สมาชิก</small><b id="users">0</b></div><div class="panel kpi"><small>รอเติมเครดิต</small><b id="pendingTopups">0</b></div><div class="panel kpi"><small>เครดิตในระบบ</small><b id="credits">0</b></div></div><div class="panel pad"><div class="section-head"><div><span class="section-kicker">TOP UPS</span><h2>คำขอเติมเครดิต</h2><p>ตรวจสอบสลิปก่อนเพิ่มเครดิตเข้าบัญชี</p></div><button class="btn" onclick="loadAll()">รีเฟรช</button></div><div class="table" id="topups">กำลังโหลด...</div></div><div class="panel pad" style="margin-top:18px"><div class="section-head"><div><span class="section-kicker">USERS</span><h2>สมาชิก</h2></div></div><div class="table" id="userTable">กำลังโหลด...</div></div><div class="panel pad" style="margin-top:18px"><div class="section-head"><div><span class="section-kicker">DONATIONS</span><h2>รายการโดเนท</h2></div></div><div class="table" id="donations">กำลังโหลด...</div></div></div></main><div id="toast" class="toast"></div><script src="/common.js"></script><script>function toast(m){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2200)}const toastEl=document.getElementById('toast');async function adminLogin(){try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:au.value,password:ap.value})});login.style.display='none';app.style.display='block';loadAll()}catch(e){am.textContent=e.message}}async function loadAll(){try{const s=await api('/api/admin/summary');users.textContent=s.users;pendingTopups.textContent=s.pendingTopups;credits.textContent=Number(s.credits).toLocaleString();const t=await api('/api/admin/topups');topups.innerHTML=t.length?'<table><tr><th>ID</th><th>User</th><th>จำนวน</th><th>ช่องทาง</th><th>สลิป</th><th>สถานะ</th><th>จัดการ</th></tr>'+t.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.username)+'</td><td>฿'+Number(x.amount).toLocaleString()+'</td><td>'+esc(x.method)+'</td><td><a class="btn" target="_blank" href="/api/topup/slip/'+encodeURIComponent(x.slip_file)+'">ดูสลิป</a></td><td><span class="pill">'+esc(x.status)+'</span></td><td>'+(x.status==='PENDING'?'<button class="btn primary" onclick="reviewTopup('+x.id+',\'APPROVED\')">อนุมัติ</button> <button class="btn" onclick="reviewTopup('+x.id+',\'REJECTED\')">ปฏิเสธ</button>':'-')+'</td></tr>').join('')+'</table>':'ไม่มีรายการ';const u=await api('/api/admin/users');userTable.innerHTML='<table><tr><th>User</th><th>อีเมล</th><th>Plan</th><th>Credits</th><th>Quota</th></tr>'+u.map(x=>'<tr><td>'+esc(x.username)+'</td><td>'+esc(x.email||'-')+'</td><td>'+esc(x.plan)+'</td><td>'+Number(x.credits).toLocaleString()+'</td><td>'+x.usage_count+'</td></tr>').join('')+'</table>';const d=await api('/api/admin/donations');donations.innerHTML='<table><tr><th>ID</th><th>Creator</th><th>Donor</th><th>Amount</th><th>Payment</th><th>Status</th><th>Slip</th><th>จัดการ</th></tr>'+d.map(x=>'<tr><td>'+x.id+'</td><td>'+esc(x.creator)+'</td><td>'+esc(x.donor||'ผู้สนับสนุน')+'</td><td>฿'+Number(x.amount).toLocaleString()+'</td><td>'+esc(x.payment_method)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td>'+(x.slip_url?'<a class="btn" target="_blank" href="/api/admin/slip/'+encodeURIComponent(x.slip_url)+'">ดู</a>':'-')+'</td><td>'+(x.status==='PENDING'?'<button class="btn primary" onclick="reviewDonation('+x.id+',\'APPROVED\')">อนุมัติ</button> <button class="btn" onclick="reviewDonation('+x.id+',\'REJECTED\')">ปฏิเสธ</button>':'-')+'</td></tr>').join('')+'</table>'}catch(e){toast(e.message)}}async function reviewTopup(id,status){await api('/api/admin/topup/'+id,{method:'POST',body:JSON.stringify({status})});toast('บันทึกแล้ว');loadAll()}async function reviewDonation(id,status){await api('/api/admin/donation/'+id+'/status',{method:'POST',body:JSON.stringify({status})});toast('บันทึกแล้ว');loadAll()}</script></body></html>
