<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creator · LUFY X DONATE</title><link rel="stylesheet" href="/style.css"></head><body><div class="shooting s1"></div><div class="shooting s2"></div><div class="shooting s3"></div><header class="nav"><div class="logo">LUFY X <b>DONATE</b></div><a href="/">หน้าหลัก</a></header><main class="container"><div class="creator-wrap"><section class="glass profile"><div class="avatar" id="avatar">LX</div><h1 id="name">Loading...</h1><div id="plan" class="pill">FREE</div><p id="bio"></p></section><section class="glass donatebox"><div class="qr"><div><div style="font-size:55px">▣</div><b id="payTitle">PromptPay</b><div id="prompt" class="sub" style="margin:8px 0 0">ยังไม่ได้ตั้งค่า</div><button class="btn" id="copyPrompt" style="margin-top:8px">คัดลอก PromptPay</button><div id="walletPhone" class="sub" style="margin-top:8px;display:none"></div><button class="btn" id="copyWalletPhone" style="display:none;margin-top:8px">คัดลอกเบอร์ TrueMoney</button><a id="wallet" class="btn" style="display:none;margin-top:8px" target="_blank" rel="noopener">เปิดลิงก์ซองอั่งเปา</a></div></div><div class="form"><h2 style="text-align:left;margin-top:0">สนับสนุน Creator</h2><label>ช่องทางชำระเงิน</label><select id="method" onchange="switchPay()"><option value="PROMPTPAY">PromptPay · แนบสลิป</option><option value="TRUEWALLET">TrueMoney · ซองอั่งเปา</option></select><label>ชื่อผู้โดเนท</label><input id="donor" placeholder="ไม่ระบุก็ได้"><label>จำนวนเงิน</label><input id="amount" type="number" min="1" placeholder="100"><label>ข้อความ</label><textarea id="message" placeholder="ส่งข้อความให้กำลังใจ..."></textarea><div id="slipWrap"><label>แนบสลิป (JPG / PNG / WEBP สูงสุด 10MB)</label><input id="slip" type="file" accept="image/jpeg,image/png,image/webp"></div><div id="videoWrap" style="display:none"><label>คลิปสำหรับ PROMAX (ใส่หรือไม่ใส่ก็ได้)</label><input id="video" placeholder="ลิงก์คลิป เช่น YouTube / TikTok / Vimeo"></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="donate()">💜 ส่งโดเนท</button><div id="result" class="sub" style="margin:12px 0 0"></div></div></section><section class="section" style="padding-top:50px"><h2>วิดีโอของ Creator</h2><div id="videos" class="video-grid"></div></section></div></main><script src="/common.js"></script><script>
const user=location.pathname.split("/").pop();
async function load(){try{let c=await api("/api/creator/"+encodeURIComponent(user));name.textContent=c.display_name||c.username;avatar.textContent=(c.display_name||c.username).slice(0,2).toUpperCase();bio.textContent=c.bio||"ขอบคุณที่สนับสนุน LUFY X";plan.textContent=c.plan;prompt.textContent=c.promptpay||"ยังไม่ได้ตั้งค่า";let v=await api("/api/videos/"+encodeURIComponent(user));videos.innerHTML=v.length?v.map(x=>'<article class="glass video"><iframe src="'+esc(x.embed_url)+'" allowfullscreen></iframe><h3>'+esc(x.title)+'</h3></article>').join(""):"<p class='sub'>ยังไม่มีวิดีโอ</p>"}catch(e){name.textContent="ไม่พบ Creator";bio.textContent=e.message}}let creatorPlan="FREE";
function switchPay(){let isT=method.value==="TRUEWALLET";slipWrap.style.display=isT?"block":"block";payTitle.textContent=isT?"TrueMoney Wallet":"PromptPay";if(isT) result.textContent='โอน/ส่งซองไปยังเบอร์ TrueMoney ของ Creator แล้วแนบหลักฐานการชำระเงิน';}
async function donate(){
 try{
  let fd=new FormData();
  fd.append("donor",donor.value);fd.append("amount",amount.value);fd.append("message",message.value);fd.append("payment_method",method.value);
  if(method.value==="TRUEWALLET")fd.append("wallet_link",wallet.dataset.link||"");
  if(slip.files[0])fd.append("slip",slip.files[0]);
  if(creatorPlan==="PROMAX"&&video.value)fd.append("video_url",video.value);
  let r=await fetch("/api/donate/"+encodeURIComponent(user),{method:"POST",body:fd}),d=await r.json();
  if(!r.ok)throw Error(d.error||"เกิดข้อผิดพลาด");
  result.textContent="ส่งรายการโดเนทแล้ว #"+d.id+" ขอบคุณครับ 💜";message.value="";slip.value="";video.value="";
 }catch(e){result.textContent=e.message}
}
async function load(){try{let c=await api("/api/creator/"+encodeURIComponent(user));creatorPlan=c.plan;name.textContent=c.display_name||c.username;avatar.textContent=(c.display_name||c.username).slice(0,2).toUpperCase();bio.textContent=c.bio||"ขอบคุณที่สนับสนุน LUFY X";plan.textContent=c.plan;prompt.textContent=c.promptpay||"ยังไม่ได้ตั้งค่า";if(c.plan==="PROMAX")videoWrap.style.display="block";if(c.truewallet_phone){walletPhone.style.display='block';walletPhone.dataset.phone=c.truewallet_phone;walletPhone.textContent='เบอร์ TrueMoney รับโดเนท: '+c.truewallet_phone;wallet.dataset.phone=c.truewallet_phone;copyWalletPhone.style.display='inline-block';copyWalletPhone.onclick=()=>{navigator.clipboard?.writeText(c.truewallet_phone);result.textContent='คัดลอกเบอร์ TrueMoney แล้ว'}}if(c.truewallet_link){wallet.style.display='inline-block';wallet.href=c.truewallet_link}copyPrompt.onclick=()=>{navigator.clipboard?.writeText(c.promptpay||"");result.textContent="คัดลอก PromptPay แล้ว"};let v=await api("/api/videos/"+encodeURIComponent(user));videos.innerHTML=v.length?v.map(x=>'<article class="glass video"><iframe src="'+esc(x.embed_url)+'" allowfullscreen></iframe><h3>'+esc(x.title)+'</h3></article>').join(""):"<p class='sub'>ยังไม่มีวิดีโอ</p>"}catch(e){name.textContent="ไม่พบ Creator";bio.textContent=e.message}}load();
</script></body></html>
