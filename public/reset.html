<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>รีเซ็ตรหัสผ่าน — LUFY X DONATE</title><link rel="stylesheet" href="/style.css"></head><body class="home-body"><main class="auth-page glass"><div class="section-kicker">ACCOUNT SECURITY</div><h1>ตั้งรหัสผ่านใหม่</h1><div class="form"><label>รหัสผ่านใหม่</label><input id="p" type="password" minlength="8"><button class="btn primary" onclick="go()">บันทึกรหัสผ่าน</button><p id="m"></p></div></main><script>async function go(){const r=await fetch('/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:new URLSearchParams(location.search).get('token'),password:p.value})});const d=await r.json();m.textContent=r.ok?'เปลี่ยนรหัสผ่านแล้ว กลับไปเข้าสู่ระบบได้เลย':(d.error||'เกิดข้อผิดพลาด')}</script></body></html>
